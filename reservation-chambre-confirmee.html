<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation confirmée · Garden Garden</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#15170f; --cream:#f6f1e5; --terra:#b95f3a; --gold:#c8a266; --muted:#716d5b; --line:rgba(21,23,15,.12); }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--cream);font-family:'Inter',sans-serif;padding:24px;}
  .card{max-width:480px;background:var(--cream);color:var(--ink);border-radius:20px;padding:44px 36px;text-align:center;}
  .check{width:56px;height:56px;border-radius:50%;background:#eaf3de;color:#3d4a26;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0 0 14px;}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 10px;}
  a.btn{display:inline-block;margin-top:20px;background:var(--terra);color:#fff;text-decoration:none;padding:13px 28px;border-radius:40px;font-weight:600;font-size:14px;}
  .tel{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Merci, votre paiement a bien été reçu</h1>
    <p>Votre chambre est réservée. Un email de confirmation avec le récapitulatif de votre séjour vous a été envoyé.</p>
    <p>Une question ? Appelez-nous au <a class="tel" href="tel:0486802750">04 86 80 27 50</a>.</p>
    <a class="btn" href="/">Retour au site</a>
  </div>
</body>
</html>
